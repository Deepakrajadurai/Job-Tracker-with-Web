name: Daily job search

# Only for running the collector on GitHub's machines WITHOUT the home server.
# The home server runs the daily search itself, so this workflow is manual now.
# To use it instead of the server, add back:
#   schedule:
#     - cron: "0 3 * * *"     # GitHub cron is UTC. 04:00 Berlin = 03:00 UTC in winter, 02:00 in summer
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jobtracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tracker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JOBTRACKER_IMAP_HOST: ${{ secrets.JOBTRACKER_IMAP_HOST }}
          JOBTRACKER_IMAP_USER: ${{ secrets.JOBTRACKER_IMAP_USER }}
          JOBTRACKER_IMAP_PASSWORD: ${{ secrets.JOBTRACKER_IMAP_PASSWORD }}
        run: |
          # Runs every committed profile in profiles/. Falls back to config.yaml.
          python -m jobtracker.run --all-profiles

      # The runner is thrown away after each run, so the state is committed back to the repo.
      - name: Commit updated state
        if: always()
        run: |
          git config user.name "jobtracker-bot"
          git config user.email "jobtracker-bot@users.noreply.github.com"
          # One folder per profile under data/. Force-add because data files are gitignored.
          find data -type f \( -name "jobs.db" -o -name "jobs.csv" -o -name "ai_cache.json" \) -exec git add -f {} +
          git diff --cached --quiet || git commit -m "Update job tracker state"
          git push

      - name: Keep the log for a week
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobtracker-log
          path: logs/
          retention-days: 7
